# Once a month (and on demand), fetch the latest Nanakshahi Jantri data, check it, and open a pull
# request if anything changed. Nothing reaches TVs until the pull request is reviewed and merged.
name: Refresh Jantri data

on:
  schedule:
    - cron: "0 6 2 * *"   # 2nd of each month; upstream rebuilds on the 1st
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and check
        id: update
        run: |
          python3 -I update.py update | tee summary.txt
          {
            echo "summary<<EOF"
            cat summary.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          rm summary.txt
      - name: Open a pull request if the data changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: Refresh Nanakshahi Jantri data
          branch: refresh-jantri-data
          title: Refresh Nanakshahi Jantri data
          body: |
            Fetched from janpreet/nanakshahi-ical and checked by update.py:

            ```
            ${{ steps.update.outputs.summary }}
            ```

            Merging publishes it to every Mosaic TV within about a week.
